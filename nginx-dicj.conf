server {
    listen 9988;
    server_name 192.168.31.42;   # 或換成你的內網域名

    root /var/www/dicj;
    index index.html;

    charset utf-8;

    # 路由由前端 hash 處理，單頁應用回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS / CSS 每次重新驗證（檔案名已含版本查詢參數）
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript;

    # 純內網演示如需保護，可取消註解並設定密碼檔：
    # auth_basic "DICJ Demo";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
